[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "nk-esg-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "jinja2>=3.1.6,<4", "uvicorn>=0.34,<1", "pdfplumber>=0.11,<0.12", "python-multipart>=0.0.20,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-subtests>=0.14,<1", "pypdf>=5,<7", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
esg_app = ["templates/*.html", "demo_templates/*.html", "static/*.css", "static/css/*.css", "static/js/*.js", "rules/*.json", "contract_schema.json"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
